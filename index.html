<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fonte">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Carnet de Fonte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E0F11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; bottom tab bar; workout mode takes the full screen with a sticky rest timer.
   Single deliberate dark look (graphite + brass, like iron plates and chalk). */
:root{
  color-scheme: dark;
  --bg:#0E0F11;
  --surface:#16181B;
  --surface-2:#1D2024;
  --surface-3:#25292E;
  --line:#2B3036;
  --fg:#ECEBE8;
  --muted:#959A9F;
  --faint:#62676D;
  --accent:#E2A955;
  --accent-soft:rgba(226,169,85,.14);
  --accent-ink:#1B1307;
  --up:#6CC593;
  --up-soft:rgba(108,197,147,.13);
  --down:#E3816F;
  --down-soft:rgba(227,129,111,.13);
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px;
  --nav-h:64px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
#app.full{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}

/* Type */
.display{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;line-height:1}
h1{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.xs{font-size:12px}
p{margin:0}

/* Structure */
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;min-height:44px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:6px;margin-inline:-4px;padding-inline:4px}
.topbar .title{flex:1;min-width:0;font-family:var(--font-display);font-weight:600;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card.tight{padding:12px 14px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list > .item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.list > .item:first-child{border-top:0}
button.item:active,.item.tap:active{background:var(--surface-2)}
.divider{height:1px;background:var(--line)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);font-weight:650;font-size:14.5px;white-space:nowrap;transition:background .15s,transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:active{filter:brightness(.92)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 35%,var(--line))}
.btn.block{width:100%}
.btn.lg{height:54px;font-size:16px;border-radius:14px}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.icon-btn svg,.btn svg{width:20px;height:20px;flex:none}
.icon-btn.sm svg{width:17px;height:17px}
.btn:disabled,.icon-btn:disabled{opacity:.35;pointer-events:none}

/* Chips & pills */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.pill.pr{background:var(--accent-soft);color:var(--accent)}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.down{background:var(--down-soft);color:var(--down)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--surface-3);color:var(--fg)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.input,select.input,textarea.input{width:100%;height:46px;padding:0 13px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);font-size:15px}
textarea.input{height:auto;min-height:72px;padding:11px 13px;resize:vertical}
.input::placeholder{color:var(--faint)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.search .input{padding-left:38px}
.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--surface-3);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px);background:var(--accent-ink)}

/* Home */
.hero-week{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end;justify-content:space-between}
.big{font-family:var(--font-display);font-weight:700;font-size:64px;line-height:.85;letter-spacing:-.01em}
.big small{font-size:22px;color:var(--muted);font-weight:600;margin-left:4px;letter-spacing:0}
.weekdots{display:flex;gap:5px}
.weekdots span{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--faint)}
.weekdots i{width:22px;height:22px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);display:block}
.weekdots i.on{background:var(--accent);border-color:var(--accent)}
.weekdots span.today{color:var(--fg)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.stats3 > div{background:var(--surface);padding:12px 12px 13px;min-width:0}
.stat-v{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,6vw,26px);line-height:1.05;overflow-wrap:anywhere}
.stat-l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-h{font-size:10.5px;font-weight:800;color:var(--faint);text-align:center;letter-spacing:.08em;padding-bottom:2px}
.cal-d{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--muted);position:relative}
.cal-d.on{background:var(--accent);color:var(--accent-ink)}
.cal-d.miss{background:var(--surface-2);color:var(--faint)}
.cal-d.miss::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--down)}
.cal-d.future{color:var(--faint);opacity:.45}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--fg)}
.cal-d .n2{position:absolute;top:2px;right:4px;font-size:9px;font-weight:800}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted);font-weight:600}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.fav-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fav{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);text-align:left;min-height:96px}
.fav:active{background:var(--surface-2)}
.fav .n{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.fav .go{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--accent)}
.banner{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-lg);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px;border:1px dashed var(--line);border-radius:var(--r-lg)}
.empty.center{align-items:center;text-align:center}
.plate{width:46px;height:46px;border-radius:50%;border:6px solid var(--surface-3);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--muted);flex:none}

/* Template list */
.tpl{display:flex;flex-direction:column;gap:12px;padding:15px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.tpl .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.tpl .exlist{font-size:13px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.star{color:var(--faint)}
.star.on{color:var(--accent)}
.star.on svg{fill:currentColor}

/* Editor */
.ed-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 14px;display:flex;flex-direction:column;gap:12px}
.ed-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.mini-field label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.mini-field .input{height:40px;padding:0 10px;font-size:14px;text-align:center}
.stepper{display:flex;align-items:center;height:40px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.stepper button{width:34px;height:100%;color:var(--muted);font-size:18px;font-weight:600}
.stepper span{flex:1;text-align:center;font-weight:700}
.idx{width:26px;height:26px;border-radius:8px;background:var(--surface-3);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);flex:none}

/* Library */
.lib-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.lib-item:first-child{border-top:0}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:15px;height:15px}
.group-label{padding:16px 2px 8px}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bottom-bar > div{max-width:528px;margin:0 auto}

/* Workout mode */
.wk-head{display:flex;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:8px;margin-inline:-4px;padding-inline:4px}
.wk-clock{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--muted)}
.wk-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:2px 4px}
.wk-tabs::-webkit-scrollbar{display:none}
.wk-tab{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:650;color:var(--muted);max-width:200px}
.wk-tab .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-tab .c{width:24px;height:24px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.wk-tab.cur{border-color:var(--fg);color:var(--fg)}
.wk-tab.done .c{background:var(--accent);color:var(--accent-ink)}
.ex-name{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.02;text-wrap:balance}
.last-perf{display:flex;flex-direction:column;gap:4px;padding:11px 13px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.sets-head,.set-row{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.sets-head{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:0 2px}
.sets-head > :nth-child(3),.sets-head > :nth-child(4){text-align:center}
.set-row{padding:6px 2px;border-radius:12px;transition:background .2s}
.set-row .n{font-family:var(--font-display);font-weight:700;font-size:20px;text-align:center;color:var(--muted)}
.set-row .prev{font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-in{width:100%;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);text-align:center;font-family:var(--font-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.set-in::placeholder{color:var(--faint)}
.vbtn{width:48px;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.vbtn svg{width:22px;height:22px}
.set-row.done{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.set-row.done .vbtn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set-row.done .set-in{background:transparent;border-color:transparent}
.set-row.done .n{color:var(--accent)}
.wk-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rest-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.rest-in{max-width:528px;margin:0 auto;display:flex;align-items:center;gap:10px}
.rest-time{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;min-width:84px}
.rest-time.over{color:var(--up)}
.rest-track{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.rest-track i{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform .25s linear}

/* Summary / detail */
.sum-hero{display:flex;flex-direction:column;gap:6px;padding:20px 18px;border-radius:var(--r-lg);background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;min-width:0}
.set-chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{display:inline-flex;align-items:baseline;gap:3px;padding:5px 9px;border-radius:9px;background:var(--surface-2);font-family:var(--font-display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.sc em{font-style:normal;color:var(--faint);font-size:13px}
.sc.pr{background:var(--accent-soft);color:var(--accent)}
.hist-month{padding:18px 2px 8px}
.hist-card{display:flex;flex-direction:column;gap:8px;padding:14px;border-top:1px solid var(--line);text-align:left;width:100%}
.hist-card:first-child{border-top:0}
.hist-card:active{background:var(--surface-2)}
.date-tile{width:46px;flex:none;text-align:center;padding:5px 0;border-radius:10px;background:var(--surface-2)}
.date-tile b{display:block;font-family:var(--font-display);font-size:22px;line-height:1}
.date-tile span{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.metrics{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.metrics b{color:var(--fg);font-weight:700}
.chart-wrap{width:100%}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.trend-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trend{padding:10px 11px;border-radius:var(--r);background:var(--surface-2);min-width:0}
.trend .v{font-family:var(--font-display);font-weight:700;font-size:19px;white-space:nowrap}
.trend .v.up{color:var(--up)} .trend .v.down{color:var(--down)}
.spark{width:72px;height:28px;flex:none}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.nav > div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.02em}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--fg)}

function calendar() {

function niceTicks(mn, mx, n) {
  if (mn === mx) { mn = mn - 1; mx = mx + 1; }

  const lo = Math.floor(mn / step) * step, hi = Math.ceil(mx / step) * step;

  return t;
}
function lineChart(pts, fmt) {

  const W = 340, H = 190, L = 44, R = 12, T = 12, Bm = 26;
  const vals = pts.map(p => p.v);
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;

  const Y = v => T + (1 - (v - y0) / ((y1 - y0) || 1)) * (H - T - Bm);
  const short = v => { const s = fmt(v); return s.replace(' reps', '').replace(' kg', ''); };
  const unit = fmt(1).includes('reps') ? 'reps' : fmt(20000).includes(' t') ? '' : 'kg';
  let g = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--faint)" font-weight="600">${esc(short(v))}</text>`).join('');
  const line = pts.map(p => `${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area = pts.length > 1 ? `<polygon points="${X(t0).toFixed(1)},${(H - Bm).toFixed(1)} ${line} ${X(t1).toFixed(1)},${(H - Bm).toFixed(1)}" fill="url(#ga)"/>` : '';

  const dl = (t, anchor) => `<text x="${X(t).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}" font-size="10.5" fill="var(--faint)" font-weight="600">${fmtDate(t, { day: 'numeric', month: 'short' })}</text>`;
  const lp = pts[pts.length - 1];
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de progression"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${g}${area}${pts.length > 1 ? `<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}${dots}${pts.length > 1 ? dl(t0, 'start') + dl(t1, 'end') : dl(t0, 'middle')}</svg></div><div class="row between xs muted"><span>Dernière valeur</span><b class="num" style="color:var(--fg);font-size:14px">${esc(fmt(lp.v))}</b></div>`;
}

function importBackup(obj) {

  d.workouts.forEach(w => { if (w && w.id && Array.isArray(w.exercises) && !ids.has(w.id)) { if (tomb.has(w.id)) S.tombstones = S.tombstones.filter(x => x !== w.id); const c = clone(w); delete c._synced; if (c.volume == null) { const st = workoutStats(c); c.volume = st.vol; c.setCount = st.sets; } S.workouts.push(c); nw++; Store.pushWorkout(c); } });
  d.templates.forEach(t => { if (t && t.id && Array.isArray(t.items) && !S.templates.some(x => x.id === t.id)) { S.templates.push(clone(t)); nt++; } });

  'goal-edit': () => modal(`<h2>Objectif par semaine</h2><p class="small muted" style="margin-top:6px">Combien de séances veux-tu faire chaque semaine ?</p>
    <div class="row" style="margin-top:16px;justify-content:center;gap:14px"><button class="icon-btn" style="width:54px;height:54px;font-size:26px" data-a="goal-step" data-d="-1" aria-label="Moins">−</button><input class="input num display" id="goal-val" inputmode="numeric" value="${S.settings.weekGoal || 3}" style="width:96px;height:64px;text-align:center;font-size:40px" aria-label="Séances par semaine"><button class="icon-btn" style="width:54px;height:54px;font-size:26px" data-a="goal-step" data-d="1" aria-label="Plus">+</button></div>

  'set-rir': d => { const x = curEx(), s = x.sets[+d.i], v = +d.v; s.rir = s.rir === v ? undefined : v; if (s.rir === undefined) delete s.rir; Store.touchActive(); const y = scrollY; render(); scrollTo(0, y); },

  'j-forme': (d, el) => { ui.forme = ui.forme === +d.v ? 0 : +d.v; document.querySelectorAll('[data-a="j-forme"]').forEach(b => { const on = +b.dataset.v === ui.forme; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); },

  'rep-nav': d => { const now = new Date(); const m = new Date(ui.repMonth || new Date(now.getFullYear(), now.getMonth(), 1).getTime()); m.setMonth(m.getMonth() + +d.d); ui.repMonth = m.getTime(); const y = scrollY; render(); scrollTo(0, y); },
  'cal-nav': d => { const m = new Date(ui.calMonth || Date.now()); m.setDate(1); m.setHours(0, 0, 0, 0); m.setMonth(m.getMonth() + +d.d); ui.calMonth = m.getTime(); const y = scrollY; render(); scrollTo(0, y); },
  'cal-day': d => { const ws = S.workouts.filter(w => startOfDay(w.endedAt) === +d.t).sort((a, b) => a.endedAt - b.endedAt); if (ws.length === 1) return go({ v: 'wdetail', id: ws[0].id }); menu(cap(fmtDateLong(+d.t)), ws.map(w => ({ label: esc(w.name) + ' · ' + fmtDur(w.duration), icon: I.dumbbell, run: () => { closeModal(); go({ v: 'wdetail', id: w.id }); } }))); },

  'wk-add-ex': () => openPicker('session'),

    { label: 'Ajouter un exercice', icon: I.plus, run: () => { closeModal(); openPicker('session'); } },
    { label: 'Abandonner la séance', icon: I.trash, danger: true, run: () => confirmBox({ title: 'Abandonner la séance ?', text: 'Les séries saisies ne seront pas enregistrées dans ton historique.', ok: 'Abandonner', danger: true, onOk: () => { S.active = null; Store.touchActive(true); closeModal(); stack = []; tab = 'home'; render(); toast('Séance abandonnée'); } }) }
  ]),
  'wk-replace': () => {
    const x = curEx(); if (!x) return;

  'wk-ex-menu': () => {

      { label: 'Descendre dans la séance', icon: I.down, run: () => { if (i < a.exercises.length - 1) { [a.exercises[i + 1], a.exercises[i]] = [a.exercises[i], a.exercises[i + 1]]; a.cur = i + 1; Store.touchActive(); } closeModal(); render(); } },
      { label: 'Voir la progression', icon: I.chart, run: () => { closeModal(); go({ v: 'exercise', id: x.exId }); } },

  'set-done': d => {
    const x = curEx(), i = +d.i, s = x.sets[i];
    if (!s.done) {
      const row = document.getElementById('set-' + i);
      const wIn = row.querySelector('[data-bind="set-w"]'), rIn = row.querySelector('[data-bind="set-r"]');
      if (s.w === '' && wIn.placeholder) s.w = wIn.placeholder.replace(',', '.');
      if (s.r === '' && rIn.placeholder && rIn.placeholder !== '0') s.r = rIn.placeholder;
      const r = num(s.r), w = num(s.w === '' ? '0' : s.w);
      if (!r || r <= 0) { toast('Indique le nombre de répétitions'); rIn.focus(); return; }
      if (w == null || w < 0) { toast('Charge invalide'); wIn.focus(); return; }
      s.w = String(w); s.r = String(Math.round(r)); s.done = true; s.doneAt = Date.now();
      // propagate to the next unvalidated sets if they were left empty
      for (let j = i + 1; j < x.sets.length; j++) if (!x.sets[j].done && x.sets[j].w === '') x.sets[j].w = s.w;
      Store.touchActive(true);
      if (S.settings.autoRest && x.rest) startRest(x.rest);
      justDone = i; lastViewKey = 'workout:'; const y = scrollY; render(); scrollTo(0, y);
      if (x.sets.every(z => z.done) && S.active.cur < S.active.exercises.length - 1) toast('Exercice terminé · passe au suivant');
    } else { s.done = false; Store.touchActive(true); const y = scrollY; render(); scrollTo(0, y); }
  },
  'set-add': () => { const x = curEx(), l = x.sets[x.sets.length - 1]; x.sets.push({ w: l ? l.w : '', r: l ? l.r : '', done: false }); Store.touchActive(true); const y = scrollY; render(); scrollTo(0, y); },
  'set-del': () => { const x = curEx(); if (x.sets.length > 1) { x.sets.pop(); Store.touchActive(true); const y = scrollY; render(); scrollTo(0, y); } },
  'rest-start': () => { const x = curEx(); startRest(x ? x.rest || S.settings.rest : S.settings.rest); },
  'rest-add': d => { const r = S.active.rest; if (!r) return; r.endAt += +d.d * 1000; r.total = Math.max(5, r.total + +d.d); if (r.endAt < Date.now()) { S.active.rest = null; renderFloat(); } Store.touchActive(); tick(); },
  'rest-stop': () => { S.active.rest = null; Store.touchActive(); renderFloat(); },
  'wk-finish': () => {
    const a = S.active;
    const done = a.exercises.reduce((n, x) => n + x.sets.filter(s => s.done).length, 0);
    const pending = a.exercises.reduce((n, x) => n + x.sets.filter(s => !s.done).length, 0);
    if (!done) return confirmBox({ title: 'Aucune série validée', text: 'Valide au moins une série (bouton ✓) pour enregistrer la séance. Tu peux aussi l’abandonner.', ok: 'Abandonner la séance', danger: true, onOk: () => { S.active = null; Store.touchActive(true); closeModal(); stack = []; render(); } });
    ui.forme = 0;
    modal(`<h2>Terminer la séance ?</h2><p class="small muted" style="margin-top:6px">${plural(done, 'série validée', 'séries validées')} ${done > 1 ? 'seront enregistrées' : 'sera enregistrée'}${pending ? `. ${plural(pending, 'série non validée', 'séries non validées')} ${pending > 1 ? 'seront ignorées' : 'sera ignorée'}` : ''}.</p>

    <div class="field"><label for="j-notes">Douleurs, sensations, notes</label><textarea class="input" id="j-notes" placeholder="Ex. : épaule droite sensible au développé, bonne énergie…" maxlength="600"></textarea></div></div>

function startFromWorkout(w) {
  if (S.active) { askActive(() => startFromWorkout(w)); return; }

  Store.touchActive(true); stack = [{ v: 'workout' }]; render(); scrollTo(0, 0); wakeLock();
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.dataset.a === 'overlay' && ev.target !== el) return;
  fn(el.dataset, el, ev);
});
document.addEventListener('submit', ev => {
  const f = ev.target; if (f.dataset.form !== 'exercise') return;
  ev.preventDefault();
  const fd = new FormData(f), name = String(fd.get('name') || '').trim();
  if (!name) return toast('Donne un nom à l’exercice');
  const id = f.dataset.id;
  if (id) {
    let c = S.customExercises.find(e => e.id === id);
    if (!c) { c = { id }; S.customExercises.push(c); }
    Object.assign(c, { name, muscle: fd.get('muscle'), equip: fd.get('equip'), updatedAt: Date.now() });
    toast('Exercice modifié');
  } else {
    const e = { id: 'c_' + uid(), name, muscle: fd.get('muscle'), equip: fd.get('equip'), createdAt: Date.now() };
    S.customExercises.push(e);
    if (ui.pick && !ui.pick.sel.includes(e.id)) ui.pick.sel.push(e.id);
    ui.libQ = '';
    toast('Exercice créé');
  }
  Store.touchLib(); closeModal(); render();
});
let bindT = {};
document.addEventListener('input', ev => {
  const el = ev.target, b = el.dataset && el.dataset.bind; if (!b) return;
  const v = el.value;
  switch (b) {
    case 'tpl-name': { const t = S.templates.find(x => x.id === el.dataset.id); t.name = v.trim() || 'Séance sans nom'; tplTouched(t); break; }
    case 'tpl-notes': { const t = S.templates.find(x => x.id === el.dataset.id); t.notes = v; tplTouched(t); break; }
    case 'it-reps': { const t = curTpl(); t.items[+el.dataset.i].reps = v.trim(); tplTouched(t); break; }
    case 'it-notes': { const t = curTpl(); t.items[+el.dataset.i].notes = v; tplTouched(t); break; }
    case 'set-w': case 'set-r': { const x = curEx(); const s = x.sets[+el.dataset.i]; s[b === 'set-w' ? 'w' : 'r'] = v.replace(',', '.').replace(/[^0-9.]/g, ''); Store.touchActive(); break; }
    case 'set-name': S.settings.name = v.trim(); Store.touchLib(); break;
    case 'lib-q': ui.libQ = v; clearTimeout(bindT.l); bindT.l = setTimeout(() => {
      const q = slug(ui.libQ); const list = allExercises().filter(e => (!ui.libMuscle || e.muscle === ui.libMuscle) && (!ui.libEquip || e.equip === ui.libEquip) && (!q || slug(e.name).includes(q))).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
      $('#lib-list').innerHTML = libList(list); }, 120); break;
    case 'hist-q': ui.histQ = v; clearTimeout(bindT.h); bindT.h = setTimeout(() => { const q = slug(v); $('#hist-list').innerHTML = histList(sortedWorkouts().filter(w => !q || slug(w.name).includes(q) || w.exercises.some(x => slug(exName(x.exId, x.name)).includes(q)))); }, 120); break;
    case 'prog-q': ui.progQ = v; clearTimeout(bindT.p); bindT.p = setTimeout(() => { const y = scrollY; const el2 = document.activeElement; render(); const i = $('#prog-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } scrollTo(0, y); }, 200); break;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target, b = el.dataset && el.dataset.bind;
  if (b === 'it-rest') { const t = curTpl(); t.items[+el.dataset.i].rest = +el.value; tplTouched(t); }
  if (b === 'set-rest') { S.settings.rest = +el.value; Store.touchLib(); }
  if (b === 'set-goal') { S.settings.weekGoal = +el.value; Store.touchLib(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#modal-root').innerHTML) closeModal();
  const el = ev.target;
  if (ev.key === 'Enter' && el.classList && el.classList.contains('set-in')) {
    ev.preventDefault();
    const ins = Array.from(document.querySelectorAll('.set-row:not(.done) .set-in'));
    const i = ins.indexOf(el);
    if (el.dataset.bind === 'set-r') { A['set-done']({ i: el.dataset.i }); } else if (ins[i + 1]) ins[i + 1].focus();
  }
});
$('#import-file').addEventListener('change', ev => {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const res = importBackup(JSON.parse(r.result)); render(); toast(`Importé : ${plural(res.nw, 'séance')}, ${plural(res.nt, 'modèle')}, ${plural(res.ne, 'exercice')}`); }
    catch (e) { toast('Fichier non reconnu : choisis une sauvegarde Carnet de Fonte (.json)'); }
    ev.target.value = '';
  };
  r.readAsText(f);
});
document.addEventListener('focusin', ev => { if (ev.target.classList && ev.target.classList.contains('set-in')) setTimeout(() => ev.target.select && ev.target.select(), 0); });

/* ───────────── Boot ───────────── */
if (S.active) stack = [{ v: 'workout' }];
render();
Store.connect().finally(() => { if ((S.presetsV || 0) < 3) { clearPresetExercises(); render(); } });
window.__fonte = { get S() { return S; }, A, render, PRESETS }; // debug hook
})();
</script>

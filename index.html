<body>
<title>Carnet de Fonte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Carnet de Fonte · design system
   Mobile-first, une colonne (max 528px), barre d'onglets fixe en bas.
   Clair = rouge / blanc / gris clair. Sombre = même structure, mêmes rôles. */
:root{
  color-scheme:light;
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#F1F2F5;
  --surface-3:#E5E7EB;
  --line:#E8EAEE;
  --line-strong:#DCDFE4;
  --fg:#17191E;
  --muted:#8B909A;
  --faint:#A3A8B0;
  --accent:#D52D3B;
  --accent-press:#B92331;
  --accent-soft:rgba(213,45,59,.09);
  --accent-ink:#FFFFFF;
  --up:#1E8E57;
  --up-soft:rgba(30,142,87,.11);
  --down:#C8463A;
  --down-soft:rgba(200,70,58,.10);
  --shadow:0 1px 2px rgba(23,25,30,.04),0 2px 10px rgba(23,25,30,.035);
  --shadow-pop:0 10px 30px rgba(23,25,30,.14);
  --bar-bg:rgba(245,246,248,.88);
  --nav-solid:#FFFFFF;
  --overlay:rgba(23,25,30,.32);
  --font-display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-sm:10px; --r:12px; --r-lg:16px;
  --nav-h:64px;
  --side:max(16px,env(safe-area-inset-left,0px),calc(50% - 264px));
  --side-r:max(16px,env(safe-area-inset-right,0px),calc(50% - 264px));
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-ui="dark"]{
  color-scheme:dark;
  --bg:#0E0F11;
  --surface:#17181B;
  --surface-2:#1F2125;
  --surface-3:#2A2C31;
  --line:rgba(255,255,255,.07);
  --line-strong:rgba(255,255,255,.12);
  --fg:#F2F3F5;
  --muted:#8B909A;
  --faint:#62676F;
  --accent:#E5484D;
  --accent-press:#CB3A3F;
  --accent-soft:rgba(229,72,77,.15);
  --up:#5CC28A;
  --up-soft:rgba(92,194,138,.13);
  --down:#E5826F;
  --down-soft:rgba(229,130,111,.13);
  --shadow:none;
  --shadow-pop:0 12px 32px rgba(0,0,0,.5);
  --bar-bg:rgba(14,15,17,.86);
  --overlay:rgba(0,0,0,.55);
}

/* ───── Base ───── */
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body:has(#modal-root > *){overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
*{touch-action:manipulation}
input,select,textarea,.input{font-size:16px!important}
svg{max-width:100%}
img{max-width:100%}
p{margin:0}
.num,.tab{font-variant-numeric:tabular-nums}

#app{min-height:100dvh;overflow-x:clip;
  padding:max(12px,env(safe-area-inset-top,0px)) var(--side-r) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px) var(--side)}
#app.full{padding-bottom:calc(136px + env(safe-area-inset-bottom,0px))}

/* ───── Type ───── */
.display{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;line-height:1}
h1{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:16px;font-weight:700;line-height:1.3;margin:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:14px}
.xs{font-size:12.5px}

/* ───── Structure ───── */
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:24px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding-top:4px}
.page-head h1{min-width:0;overflow-wrap:anywhere}
.topbar,.wk-head{display:flex;align-items:center;gap:8px;min-height:52px;position:sticky;top:0;z-index:5;
  margin:calc(-1 * max(12px,env(safe-area-inset-top,0px))) calc(-1 * var(--side-r)) 0 calc(-1 * var(--side));
  padding:calc(max(12px,env(safe-area-inset-top,0px)) + 4px) var(--side-r) 6px var(--side);
  background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
.topbar{padding-left:calc(var(--side) - 8px)}
.topbar .title{flex:1;min-width:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;min-height:32px}
.link{font-size:14px;font-weight:700;color:var(--accent);padding:6px 0;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.tight{padding:12px 14px}
button.card{display:block;width:100%;text-align:left}
button.card:active{background:var(--surface-2)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.list > .item{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;border-top:1px solid var(--line);text-align:left;width:100%}
.list > .item:first-child{border-top:0}
.list > .item > svg,.sheet .item svg{width:20px;height:20px;flex:none;color:var(--muted)}
.item[style*="color"] > svg{color:inherit}
button.item:active,.item.tap:active,[data-a="fr-card"]:active{background:var(--surface-2)}
.divider{height:1px;background:var(--line)}
.chev{color:var(--faint);display:inline-flex;flex:none}
.chev svg{width:18px;height:18px}

/* ───── Buttons ───── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line-strong);font-weight:700;font-size:15px;white-space:nowrap;color:var(--fg);transition:background .15s,transform .12s,border-color .15s}
.btn:active{transform:scale(.98);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:active{background:var(--accent-press);border-color:var(--accent-press)}
.btn.tint{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:active{background:var(--surface-2)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 30%,var(--line))}
.btn.primary.danger{background:var(--down);border-color:var(--down);color:#fff}
.btn.block{width:100%}
.btn.lg{height:52px;font-size:16px;border-radius:14px}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px;gap:6px}
.btn svg{width:18px;height:18px;flex:none}
.btn.sm svg{width:16px;height:16px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex:none;transition:background .15s,transform .12s}
.icon-btn:active{background:var(--surface-3);transform:scale(.94)}
.icon-btn.sm{width:36px;height:36px;border-radius:10px;color:var(--muted)}
.icon-btn svg{width:22px;height:22px;flex:none}
.icon-btn.sm svg{width:19px;height:19px}
.icon-btn.soft{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn:disabled,.icon-btn:disabled{opacity:.35;pointer-events:none}
@media (hover:hover){.icon-btn:hover{background:var(--surface-2)}.btn:not(.primary):hover{background:var(--surface-2)}.btn.primary:hover{background:var(--accent-press)}}

/* ───── Chips, pills, segmented ───── */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--side)) calc(-1 * var(--side-r));padding:2px var(--side-r) 2px var(--side)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:13.5px;font-weight:650;color:var(--muted);transition:background .15s,color .15s}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.pr{background:var(--accent-soft);color:var(--accent)}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.down{background:var(--down-soft);color:var(--down)}
.seg{display:flex;background:var(--surface-3);border-radius:11px;padding:2px;gap:2px}
:root[data-ui="dark"] .seg{background:var(--surface-2)}
.seg button{flex:1;height:32px;border-radius:9px;font-size:13.5px;font-weight:650;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(23,25,30,.10)}
:root[data-ui="dark"] .seg button.on{background:var(--surface-3)}
.seg.sm button{height:28px;padding:0 9px;font-size:12.5px}

/* ───── Forms ───── */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.input,select.input,textarea.input{width:100%;height:46px;padding:0 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line-strong);transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:76px;padding:11px 14px;resize:vertical}
.input::placeholder{color:var(--faint)}
.input:focus,.set-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search .input{padding-left:40px;background:var(--surface)}
.searchbar{display:flex;align-items:center;gap:6px;animation:drop .2s var(--ease)}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:var(--surface-3);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}

/* ───── Accueil ───── */
.hello{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.hello h1{overflow-wrap:anywhere}
.wk-card{display:flex;flex-direction:column;gap:14px}
.wk-count{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.wk-count b{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1}
.wk-count span{font-size:15px;font-weight:650;color:var(--muted)}
.goal-bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.goal-bar i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .4s var(--ease)}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.wd-l{font-size:11px;font-weight:700;color:var(--muted)}
.wd-d{position:relative;width:100%;max-width:40px;aspect-ratio:1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface-2);color:var(--fg);transition:transform .12s}
button.wd-d:active{transform:scale(.92)}
.wd-d.on{background:var(--accent);color:var(--accent-ink)}
.wd-d.today:not(.on){box-shadow:inset 0 0 0 1.5px var(--fg)}
.wd-d.future{background:transparent;color:var(--faint)}
.wd.today .wd-l{color:var(--fg)}
.wd-d .n2{position:absolute;top:1px;right:3px;font-size:9px;font-weight:800}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;white-space:nowrap}
.streak svg{width:17px;height:17px;color:var(--accent)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3 > div{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);min-width:0}
.stat-v{font-family:var(--font-display);font-weight:700;font-size:clamp(21px,6.4vw,26px);line-height:1.05;overflow-wrap:anywhere}
.stat-l{font-size:12px;color:var(--muted);font-weight:600}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);text-align:left;width:100%}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.last-card{display:flex;flex-direction:column;gap:12px}
.lc-name{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.mstats{display:flex;gap:8px}
.mstats > div{flex:1;min-width:0;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.mstats b{display:block;font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.1;white-space:nowrap}
.mstats span{font-size:11.5px;font-weight:600;color:var(--muted)}
.ic-dot{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ic-dot svg{width:18px;height:18px}
.ic-dot.grey{background:var(--surface-2);color:var(--fg)}
.rec-v{font-family:var(--font-display);font-weight:700;font-size:19px;white-space:nowrap;text-align:right}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px;border:1px dashed var(--line-strong);border-radius:var(--r-lg);background:transparent}
.empty.center{align-items:center;text-align:center}
.plate{width:46px;height:46px;border-radius:50%;border:6px solid var(--surface-3);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--muted);flex:none}

/* ───── Séances ───── */
.tpl{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tpl-head{display:flex;align-items:flex-start;gap:4px}
.tpl-tog{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0;text-align:left;padding:2px 0}
.tpl-name{font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.tpl-meta{font-size:13px;color:var(--muted);margin-top:2px}
.tpl-tog .chev{margin-top:2px;transition:transform .2s var(--ease)}
.tpl.open .tpl-tog .chev{transform:rotate(180deg)}
.tpl-body{display:flex;flex-direction:column;gap:6px;animation:drop .2s var(--ease)}
.tpl-body ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.tpl-body li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.tpl-body li:first-child{border-top:0}
.tpl-body li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tpl .row .btn{flex:1}
.star{color:var(--faint)}
.star.on{color:var(--accent)}

/* ───── Éditeur ───── */
.ed-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.ed-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.mini-field label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mini-field .input{height:40px;padding:0 10px;text-align:center}
.stepper{display:flex;align-items:center;height:40px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line-strong)}
.stepper button{width:36px;height:100%;color:var(--muted);font-size:19px;font-weight:600;flex:none}
.stepper span{flex:1;text-align:center;font-weight:700}
.idx{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);flex:none}

/* ───── Bibliothèque ───── */
.lib-item{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;min-height:52px;border-top:1px solid var(--line);width:100%;text-align:left}
.lib-item:first-child{border-top:0}
.lib-item:active{background:var(--surface-2)}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line-strong);flex:none;display:flex;align-items:center;justify-content:center;transition:background .15s}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:15px;height:15px}
.group-label{padding:16px 4px 8px}
.bottom-bar,.rest-bar{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;padding:10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-pop);animation:rise .22s var(--ease)}
.bottom-bar > div{max-width:528px;margin:0 auto}
@keyframes rise{from{transform:translateY(16px);opacity:0}}

/* ───── Séance en cours ───── */
.wk-head{padding-left:calc(var(--side) - 8px)}
.wk-clock{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--muted)}
.wk-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--side)) calc(-1 * var(--side-r));padding:4px var(--side-r) 4px var(--side)}
.wk-tabs::-webkit-scrollbar{display:none}
.wk-tab{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);font-size:13px;font-weight:650;color:var(--muted);max-width:200px}
.wk-tab .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-tab .c{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.wk-tab.cur{border-color:var(--fg);color:var(--fg)}
.wk-tab.done .c{background:var(--accent);color:var(--accent-ink)}
.ex-name{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.last-perf{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.sets-head,.set-row{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.sets-head{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.sets-head > :nth-child(3),.sets-head > :nth-child(4){text-align:center}
.set-row{position:relative;padding:6px 2px;border-radius:12px;transition:background .2s}
.set-row .n{font-family:var(--font-display);font-weight:700;font-size:20px;text-align:center;color:var(--muted)}
.set-row .prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-in{width:100%;height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line-strong);text-align:center;font-family:var(--font-display);font-weight:600;font-size:22px!important;font-variant-numeric:tabular-nums;transition:border-color .15s,background .2s}
.set-in::placeholder{color:var(--faint)}
.vbtn{width:48px;height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--faint);transition:background .2s,color .2s,transform .12s}
.vbtn:active{transform:scale(.92)}
.vbtn svg{width:22px;height:22px}
.set-row.done{background:var(--accent-soft)}
.set-row.done .vbtn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set-row.done .set-in{background:transparent;border-color:transparent}
.set-row.done .n{color:var(--accent)}
.set-row.just .vbtn{animation:pop .25s var(--ease)}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.rir-row{display:flex;align-items:center;gap:6px;padding:0 2px 6px 44px;flex-wrap:wrap}
.rir{height:30px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line-strong);background:var(--surface)}
.rir.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.rir.on.fail{background:var(--down-soft);color:var(--down)}
.suggest{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r);background:var(--up-soft);border:1px solid color-mix(in srgb,var(--up) 25%,transparent)}
.suggest b{color:var(--up)}
.wk-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rest-bar{z-index:40;padding:10px 12px}
.rest-in{display:flex;align-items:center;gap:8px}
.rest-time{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1;min-width:80px}
.rest-time.over{color:var(--up)}
.rest-track{height:5px;border-radius:5px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.rest-track i{display:block;height:100%;background:var(--accent);border-radius:5px;transform-origin:left;transition:transform .25s linear}
.formes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.formes button{height:54px;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--line-strong);background:var(--surface)}
.formes button b{font-family:var(--font-display);font-size:20px;color:var(--fg)}
.formes button.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* ───── Résumé / détail ───── */
.sum-hero{display:flex;flex-direction:column;gap:6px;padding:20px 18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;min-width:0;box-shadow:var(--shadow)}
.set-chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{display:inline-flex;align-items:baseline;gap:3px;padding:4px 9px;border-radius:8px;background:var(--surface-2);font-family:var(--font-display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.sc em{font-style:normal;color:var(--muted);font-size:13px}
.sc.pr{background:var(--accent-soft);color:var(--accent)}
.sc .rt{font-family:var(--font-body);font-size:10.5px;font-weight:800;color:var(--muted);margin-left:4px}
.metrics{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0;font-size:13px;color:var(--muted)}
.metrics > span{white-space:nowrap}
.metrics > span + span::before{content:"·";margin:0 6px;color:var(--faint)}
.hist-card .metrics{font-size:12.5px}
.metrics b{color:var(--fg);font-weight:700}
.hist-month{padding:16px 4px 8px}
.hist-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.hist-card:first-child{border-top:0}
.hist-card:active{background:var(--surface-2)}
.date-tile{width:44px;flex:none;text-align:center;padding:5px 0;border-radius:10px;background:var(--surface-2)}
.date-tile b{display:block;font-family:var(--font-display);font-size:21px;line-height:1}
.date-tile span{font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.hist-name{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.journal-tag{font-size:12px}
.chart-wrap{width:100%}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.trend-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trend{padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0}
.trend .v{font-family:var(--font-display);font-weight:700;font-size:19px;white-space:nowrap}
.trend .v.up{color:var(--up)} .trend .v.down{color:var(--down)}
.spark{width:64px;height:26px;flex:none}

/* ───── Calendrier ───── */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cal-month{height:36px;min-width:104px;padding:0 4px;font-weight:700;font-size:14px;white-space:nowrap;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;touch-action:pan-y}
.cal-h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-d{aspect-ratio:1.2;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--fg);position:relative;background:var(--surface-2);padding:0;font-family:inherit;transition:transform .12s}
button.cal-d:active{transform:scale(.92)}
.cal-d.on{background:var(--accent);color:var(--accent-ink)}
.cal-d.miss{color:var(--muted)}
.cal-d.miss::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--down);opacity:.7}
.cal-d.future{background:transparent;color:var(--faint)}
.cal-d.today:not(.on){box-shadow:inset 0 0 0 1.5px var(--fg)}
.cal-d .n2{position:absolute;top:1px;right:4px;font-size:9px;font-weight:800}
.cal-foot{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.cal-legend{display:flex;gap:12px}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal-body{animation:drop .2s var(--ease)}

/* ───── Progression ───── */
.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats4 > div{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);min-width:0}
@media (min-width:520px){.stats4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ms-row{display:flex;flex-direction:column;gap:7px}
.ms-track{position:relative;height:8px;border-radius:6px;background:var(--surface-2)}
.ms-track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .4s var(--ease)}
.ms-zone{position:absolute;top:-3px;bottom:-3px;border-radius:4px;border:1px dashed color-mix(in srgb,var(--muted) 55%,transparent)}
.ms-ok{background:var(--up)}
.ms-high{background:var(--accent)}
.ms-low{background:var(--muted)}
.ms-zero{width:0}
.ms-avg{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:2px;background:var(--fg);opacity:.5}
.ms-key{display:inline-block;width:14px;height:8px;border-radius:3px;margin-right:6px;vertical-align:0}
.ms-key.zone{border:1px dashed var(--muted)}
.ms-key.avg{width:2px;height:12px;background:var(--fg);opacity:.5;vertical-align:-2px}
.ms-n{font-family:var(--font-display);font-weight:700;font-size:18px}
.rec-list .item{min-height:60px}

/* ───── Amis ───── */
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:16px}
.av.lg{width:56px;height:56px;font-size:22px}
.av img,.pc-av img{width:100%;height:100%;object-fit:cover;display:block}
.fr-hero{display:flex;flex-direction:column;gap:14px}
.fr-nm{font-size:20px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.fr-sub{font-size:13px;color:var(--muted)}
.fr-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fr-stats > div{padding:8px 10px;border-radius:10px;background:var(--surface-2);min-width:0}
.fr-stats b{display:block;font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.1}
.fr-stats span{font-size:11.5px;font-weight:600;color:var(--muted)}
.fr-row{cursor:pointer}
.fr-row.me{background:var(--accent-soft)}
.rk{width:22px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--muted);flex:none}
.rk.top{color:var(--accent)}
.fr-n{font-weight:700;overflow-wrap:anywhere}
.fr-v{text-align:right;flex:none}
.fr-v b{display:block;font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1}
.fr-v span{font-size:11px;color:var(--muted);font-weight:600}
.mini{height:4px;border-radius:99px;background:var(--surface-3);margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px}
.pcard{border-radius:var(--r-lg);padding:20px 16px 16px;text-align:center;background:var(--surface);border:1px solid var(--line)}
.pc-av{width:88px;height:88px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent);font-size:36px;font-weight:800}
.pc-name{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.pc-sub{font-size:13px;color:var(--muted);margin-top:2px}
.pc-streak{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);text-align:left}
.pc-streak b{font-family:var(--font-display);font-size:34px;line-height:1}
.pc-streak span{font-size:13.5px;font-weight:700;line-height:1.3}
.pc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pc-s{padding:10px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:1px}
.pc-s b{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.1}
.pc-s span{font-size:12px;color:var(--muted);font-weight:600}
.pc-row{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--surface-2);text-align:left;display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.pc-row span{color:var(--muted)}
.pc-row b{text-align:right;overflow-wrap:anywhere}

/* ───── Photos ───── */
.ph-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ph{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--surface-2);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:20px 10px 8px;font-size:12px;font-weight:700;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cmp > div{min-width:0}
.cmp .input{height:40px;padding:0 8px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;margin-top:8px;display:block}

/* ───── Profil ───── */
.set-row-in{width:120px;height:38px;text-align:right}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.cloud i{background:var(--up)}
.sync.syncing i{background:var(--accent)}
.sync.local i{background:var(--down)}
textarea.export{width:100%;height:200px;font-family:ui-monospace,Menlo,monospace;font-size:11px!important;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;color:var(--muted)}
details.more > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.more > summary::-webkit-details-marker{display:none}
details.more[open] > summary .chev{transform:rotate(180deg)}
details.more .chev{transition:transform .2s var(--ease)}

/* ───── Barre d'onglets ───── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  background:var(--nav-solid);
  transition:transform .25s var(--ease),opacity .2s}
.nav > div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);padding:6px 4px 4px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);min-width:0}
.nav .ni{display:grid;place-items:center;width:56px;height:30px;border-radius:15px;transition:background .2s var(--ease)}
.nav .ni svg{width:23px;height:23px}
.nav button > span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button.on{color:var(--accent)}
.nav button.on .ni{background:var(--accent-soft)}
.nav button:active .ni{transform:scale(.92)}
.kb .nav{transform:translateY(110%);opacity:0;pointer-events:none}
.kb .rest-bar,.kb .bottom-bar,.kb .toast{visibility:hidden}

/* ───── Feuilles, menus, toasts ───── */
.overlay{position:fixed;inset:0;z-index:60;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:560px;max-height:min(88%,calc(100dvh - 24px));overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s var(--ease);box-shadow:var(--shadow-pop)}
.sheet .grab{width:36px;height:5px;border-radius:5px;background:var(--surface-3);margin:-6px auto 14px}
.sheet .list{box-shadow:none}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(28px);opacity:.4}}
@keyframes drop{from{transform:translateY(-6px);opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:650;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow-pop);animation:toastin .2s var(--ease)}
@keyframes toastin{from{transform:translate(-50%,10px);opacity:0}}
.toast.hi{bottom:calc(136px + env(safe-area-inset-bottom,0px))}

/* ───── Transitions de vue ───── */
.view-in > *{animation:viewin .2s var(--ease) both}
.view-in > .topbar,.view-in > .wk-head{animation:fade .2s both}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}}

/* ───── Signature : rouge lumineux (inspiré de la maquette) ───── */
:root{--grad:linear-gradient(180deg,#EE4A53 0%,#D52D3B 100%);--glow:0 8px 22px -10px rgba(213,45,59,.75)}
:root[data-ui="dark"]{--nav-solid:#111114;--bg:#0B0B0D;--surface:#141417;--surface-2:#1C1C20;--surface-3:#28282D;--line:rgba(255,255,255,.07);--grad:linear-gradient(180deg,#FF5A61 0%,#E5484D 55%,#C83238 100%);--glow:0 10px 26px -10px rgba(229,72,77,.8);--bar-bg:rgba(11,11,13,.86)}
:root[data-ui="dark"] body{background:transparent}
:root[data-ui="dark"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(90% 45% at 0% 0%,rgba(229,72,77,.16),transparent 65%),radial-gradient(80% 40% at 100% 100%,rgba(229,72,77,.10),transparent 65%)}
:root[data-ui="dark"] :is(.card,.list,.tpl,.stats3 > div,.stats4 > div,.kv > div,.ed-item,.last-perf,.trend){background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--surface)}
.btn.primary{background:var(--grad);border-color:transparent;box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.primary:active{background:var(--accent-press);box-shadow:none}
@media (hover:hover){.btn.primary:hover{background:var(--grad);filter:brightness(1.06)}}
.btn.tint{border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.wd-d.on,.cal-d.on,.check.on,.set-row.done .vbtn,.switch.on{background:var(--grad)}
.goal-bar i,.mini i,.rest-track i{background:linear-gradient(90deg,#C83238,#F0555C)}
:root[data-ui="dark"] .goal-bar i{box-shadow:0 0 10px rgba(229,72,77,.55)}
:root{--ring-a:#FF8A8F;--ring-b:#D52D3B}
:root[data-ui="dark"]{--ring-a:#FF8A8F;--ring-b:#E5484D}
.rings3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:16px 2px 14px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
:root[data-ui="dark"] .rings3{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--surface)}
.sring{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 2px;text-align:center;min-width:0}
.sring + .sring{border-left:1px solid var(--line)}
.ring.sm{width:min(114px,100%);height:auto;aspect-ratio:1;margin-bottom:6px}
.ring.sm .rg-halo{fill:var(--surface-2);stroke:none}
:root[data-ui="dark"] .ring.sm .rg-halo{fill:rgba(255,255,255,.035)}
.ring.sm .rg-bg{stroke:var(--surface-3);stroke-width:8}
:root[data-ui="dark"] .ring.sm .rg-bg{stroke:rgba(255,255,255,.08)}
.ring.sm .rg-fg{stroke-width:8}
.ring.sm b{font-size:clamp(17px,5.2vw,23px);padding:0 14px;overflow-wrap:anywhere;line-height:1}
.sring-l{font-size:14px;font-weight:700;color:var(--muted)}
.sring-h{font-size:11.5px;color:var(--faint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rings4{grid-template-columns:repeat(4,minmax(0,1fr));padding:14px 0 12px}
.rings4 .sring{padding:0 1px}
.rings4 .ring.sm{width:min(96px,100%)}
.rings4 .ring.sm b{font-size:clamp(15px,4.6vw,20px);padding:0 6px}
.rings4 .sring-l{font-size:13.5px}
.rings4 .sring-h{font-size:11px}
.hello-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.hello-row .hello{min-width:0;padding:0}
.ring-btn{flex:none;border-radius:50%}
.ring{position:relative;width:84px;height:84px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.rg-bg{stroke:var(--surface-3)}
.rg-fg{stroke:var(--accent);transition:stroke-dashoffset .6s var(--ease)}

/* ───────────── Utilities ───────────── */
const $ = s => document.querySelector(s);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.').trim()); return isFinite(n) ? n : null; };
const fmtN = n => n == null ? '–' : (Math.round(n * 100) / 100).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
const fmtKg = n => n == null ? '–' : fmtN(n) + ' kg';
const fmtVol = n => !n ? '0 kg' : n >= 10000 ? (n / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' t' : Math.round(n).toLocaleString('fr-FR') + ' kg';

const fmtDur = s => { const m = Math.round(s / 60); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h ' + pad(m % 60); };

/* ───────────── Storage (cloud db + local cache) ───────────── */
const Store = {
  db: null, base: null, mode: 'connecting', chains: {}, timers: {}, lastErr: null,

  setMode(m) { this.mode = m; document.querySelectorAll('[data-sync]').forEach(el => el.outerHTML = syncBadge()); },
  libRef() { return this.db.doc(this.base + '/library'); },

  chain(key, fn) {

  fail(e) {

  touchLib() {
    S.libUpdatedAt = Date.now(); dirtyLib = true; this.saveLocal(); sbSyncSoon(4000);
    if (!this.db) return;
    this.debounce('lib', () => this.chain('lib', () => this.retry(() => this.libRef().set(clone(this.libPayload()))).then(() => { if (this.mode === 'error') this.setMode('cloud'); })), 700);
  },
  touchActive(immediate) {
    S.activeUpdatedAt = Date.now(); this.saveLocal();
    if (!this.db) return;
    const push = () => this.chain('active', () => this.retry(() => this.activeRef().set({ session: clone(S.active), updatedAt: S.activeUpdatedAt })));

  pushWorkout(w) {
    this.saveLocal(); sbSyncSoon();
    if (!this.db) return Promise.resolve();
    return this.chain('w:' + w.id, async () => {
      const body = clone(w); delete body._synced;
      await this.retry(() => this.wCol().doc(w.id).set(body));
      w._synced = true; this.saveLocal(); if (this.mode === 'error' && S.workouts.every(z => z._synced)) this.setMode('cloud');
    });
  },
  deleteWorkout(id) {
    S.tombstones = (S.tombstones || []).concat(id);

}
function lineChart(pts, fmt) {

function importBackup(obj) {

    modal(`<h2>Terminer la séance ?</h2><p class="small muted" style="margin-top:6px">${plural(done, 'série validée', 'séries validées')} ${done > 1 ? 'seront enregistrées' : 'sera enregistrée'}${pending ? `. ${plural(pending, 'série non validée', 'séries non validées')} ${pending > 1 ? 'seront ignorées' : 'sera ignorée'}` : ''}.</p>
    <div class="stack" style="margin-top:16px;gap:14px"><div class="field"><label>Forme du jour</label><div class="formes" role="group">${FORMES.map((f, i) => `<button type="button" data-a="j-forme" data-v="${i + 1}" aria-pressed="false"><b>${i + 1}</b>${f}</button>`).join('')}</div></div>
    <div class="field"><label for="j-sleep">Sommeil la nuit dernière</label><select class="input" id="j-sleep"><option value="">Non renseigné</option>${['moins de 5 h', '5 h', '6 h', '7 h', '8 h', '9 h', '10 h et plus'].map(v => `<option>${v}</option>`).join('')}</select></div>
    <div class="field"><label for="j-notes">Douleurs, sensations, notes</label><textarea class="input" id="j-notes" placeholder="Ex. : épaule droite sensible au développé, bonne énergie…" maxlength="600"></textarea></div></div>

  },
  'summary-done': () => { stack = []; tab = 'home'; render(); appScroll(0); },
  toggle: d => { S.settings[d.k] = !S.settings[d.k]; Store.touchLib(); render(); },
  'export-json': () => { const d = new Date(); offerFile(`carnet-de-fonte-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`, JSON.stringify(backupObject(), null, 1)); },
  'export-csv': () => { if (!S.workouts.length) return toast('Aucune séance à exporter'); const d = new Date(); offerFile(`carnet-de-fonte-series-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.csv`, toCsv()); },
  'copy-export': () => { const t = $('#export-text'); const done = () => toast('Copié'); try { navigator.clipboard.writeText(t.value).then(done, () => { t.select(); toast('Sélectionné : copie avec Ctrl/Cmd + C'); }); } catch (e) { t.select(); } },

function startFromWorkout(w) {
